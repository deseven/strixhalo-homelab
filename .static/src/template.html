<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-default wa-brand-blue">
<head>
  <script>
    (() => {
      const root = document.documentElement;
      const dark = window.matchMedia("(prefers-color-scheme: dark)");
      const apply = (dark) => {
        root.classList.toggle("wa-dark", dark);
        root.classList.toggle("wa-light", !dark);
      };
      apply(dark.matches);
      dark.addEventListener("change", (e) => apply(e.matches));
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title><%= title %> · Strix Halo HomeLab Wiki</title>
  <link rel="icon" href="<%= rawUrl('README/amd-favicon.png') %>">
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/themes/default.css">
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/utilities.css">
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/native.css">
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.12.0/webawesome.loader.js"></script>
  <style>
    /* ---- page shell ---- */
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      min-height: 0;
    }
    @media (min-width: 64rem) {
      .layout {
        grid-template-columns: 16rem minmax(0, 1fr) 13rem;
      }
      .layout.no-toc {
        grid-template-columns: 16rem minmax(0, 1fr);
      }
    }

    aside.sidebar {
      display: none;
      background: var(--wa-color-surface-raised);
      border-inline-end: 1px solid var(--wa-color-surface-border);
      overflow-y: auto;
    }
    @media (min-width: 64rem) {
      aside.sidebar { display: flex; flex-direction: column; }
    }
    .sidebar-header {
      padding: 1rem 1.25rem;
      font-size: 1.125rem;
      font-weight: 700;
      border-bottom: 1px solid var(--wa-color-surface-border);
    }
    .sidebar-header a { color: var(--wa-color-text-normal); text-decoration: none; }
    .sidebar-header a:hover { color: var(--wa-color-focus); }
    .sidebar-brand {
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .sidebar-favicon {
      width: 1.5rem; height: 1.5rem;
      object-fit: contain;
      flex-shrink: 0;
    }
    .sidebar-search {
      position: sticky; top: 0; z-index: 1;
      padding: 0.5rem 1rem;
      background: color-mix(in srgb, var(--wa-color-surface-raised) 85%, transparent);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--wa-color-surface-border);
    }
    .sidebar-search input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.375rem 0.75rem;
      font: inherit; font-size: 0.875rem;
      color: var(--wa-color-text-normal);
      background: var(--wa-color-surface-default);
      border: 1px solid var(--wa-color-surface-border);
      border-radius: 0.5rem;
    }
    .sidebar-search input:focus { outline: 2px solid var(--wa-color-focus); outline-offset: 1px; }
    .sidebar-tree { padding: 0.75rem 0.75rem 1rem; flex: 1; }

    main { overflow-y: auto; min-width: 0; }

    .content-wrap {
      /* Slightly wider than classic 65ch so tables and code get breathing
         room, now that the nav rails are slimmer. */
      max-width: 78ch;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3.5rem;
    }
    .page-title {
      margin: 0 0 1.5rem;
      font-size: 2rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--wa-color-text-normal);
    }
    .page-footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--wa-color-surface-border);
      font-size: 0.75rem;
      color: var(--wa-color-text-quiet);
      display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem;
    }
    .page-footer a {
      color: var(--wa-color-text-normal);
      overflow-wrap: anywhere;
    }
    .page-footer a:hover { color: var(--wa-color-text-link); }

    .sidebar-open { display: block; }
    @media (min-width: 64rem) {
      .sidebar-open { display: flex; }
    }

    .mobile-nav {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 35; /* below the drawer+backdrop (both z-index 40) */
      height: 3.5rem;
      padding: 0 1rem;
      align-items: center;
      gap: 0.75rem;
      background: var(--wa-color-surface-raised);
      border-bottom: 1px solid var(--wa-color-surface-border);
    }
    @media (max-width: 63.999rem) {
      .mobile-nav { display: flex; }
    }
    @media (min-width: 64rem) {
      #menu-btn, #toc-btn { display: none; }
    }
    .mobile-nav-spacer { flex: 1; }
    .mobile-nav .nav-btn {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      font: inherit; font-size: 0.875rem; font-weight: 600;
      color: var(--wa-color-brand-on-loud, #fff);
      background: var(--wa-color-brand-fill-loud);
      border: 0; border-radius: 9999px;
      cursor: pointer;
    }
    .mobile-nav .nav-btn:hover { background: var(--wa-color-brand-fill-normal); }

    @media (max-width: 63.999rem) {
      .content-wrap { padding-top: 5.5rem; }
    }

    /* ---- mobile drawers ---- */
    .mobile-drawer {
      position: fixed; inset: 0; z-index: 40; display: none;
    }
    .mobile-drawer.open { display: block; }
    .mobile-drawer .backdrop {
      position: absolute; inset: 0;
      background: rgb(0 0 0 / 0.6);
    }
    .mobile-drawer .drawer {
      position: absolute; top: 0; height: 100%;
      width: 20rem; max-width: 85vw;
      background: var(--wa-color-surface-raised);
      overflow-y: auto; padding: 1rem;
    }
    #mobile-tree .drawer {
      left: 0;
      border-inline-end: 1px solid var(--wa-color-surface-border);
    }
    #mobile-toc .drawer {
      right: 0;
      border-inline-start: 1px solid var(--wa-color-surface-border);
    }

    /* ---- content prose ---- */
    #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
      scroll-margin-top: 1.5rem;
    }
    /* GitHub-style alerts (markdown-alert markup emitted by markdown-it-github-alerts).*/
    .markdown-alert {
      border-left: 6px solid var(--wa-color-surface-border);
      border-radius: 0 0.5rem 0.5rem 0;
      padding: 0.75rem 1rem;
      background: color-mix(in srgb, var(--wa-color-surface-lowered) 45%, transparent);
      margin: 1rem 0;
    }
    .markdown-alert > p { margin: 0.25rem 0; }
    .markdown-alert-title {
      font-weight: 700;
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.25rem;
    }
    .markdown-alert-title svg { width: 1em; height: 1em; fill: currentColor; }
    /* Accent colors that read well on both light and dark surfaces. */
    .markdown-alert-note        { border-left-color: #0b5cad; }
    .markdown-alert-note .markdown-alert-title { color: #0b5cad; }
    .markdown-alert-tip         { border-left-color: #16794c; }
    .markdown-alert-tip .markdown-alert-title { color: #16794c; }
    .markdown-alert-important   { border-left-color: #6b40c2; }
    .markdown-alert-important .markdown-alert-title { color: #6b40c2; }
    .markdown-alert-warning     { border-left-color: #9a6700; }
    .markdown-alert-warning .markdown-alert-title { color: #9a6700; }
    .markdown-alert-caution     { border-left-color: #cf222e; }
    .markdown-alert-caution .markdown-alert-title { color: #cf222e; }
    /* Dark mode: brighter tint variants that read well on dark surfaces. */
    .wa-dark .markdown-alert-note        { border-left-color: #58a6ff; }
    .wa-dark .markdown-alert-note .markdown-alert-title { color: #58a6ff; }
    .wa-dark .markdown-alert-tip         { border-left-color: #3fb950; }
    .wa-dark .markdown-alert-tip .markdown-alert-title { color: #3fb950; }
    .wa-dark .markdown-alert-important   { border-left-color: #bc8cff; }
    .wa-dark .markdown-alert-important .markdown-alert-title { color: #bc8cff; }
    .wa-dark .markdown-alert-warning     { border-left-color: #d29922; }
    .wa-dark .markdown-alert-warning .markdown-alert-title { color: #d29922; }
    .wa-dark .markdown-alert-caution     { border-left-color: #f85149; }
    .wa-dark .markdown-alert-caution .markdown-alert-title { color: #f85149; }

    /* ---- TOC ---- */
    #toc-nav {
      position: sticky; top: 0;
      background: var(--wa-color-surface-raised);
      border-inline-start: 1px solid var(--wa-color-surface-border);
    }
    /* On mobile the desktop TOC rail is hidden; "On this page" opens as a
       right-side drawer via #toc-btn in the top bar. */
    @media (max-width: 63.999rem) {
      #toc-nav { display: none; }
    }
    .toc-header {
      padding: 1rem 1.25rem;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--wa-color-text-quiet);
      border-bottom: 1px solid var(--wa-color-surface-border);
    }
    .toc-list { padding: 1rem 1rem 1.5rem; font-size: 0.875rem; display: flex; flex-direction: column; gap: 0.125rem; }

    /* ---- tables: allow wrapping of long words/URLs ---- */
    #content table {
      table-layout: auto;
      min-width: 0;
    }
    #content table th,
    #content table td {
      overflow-wrap: anywhere;
      word-break: normal;
    }
    #content a {
      overflow-wrap: anywhere;
      word-break: normal;
    }
    .toc-list a {
      color: var(--wa-color-text-quiet);
      text-decoration: none;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
    }
    .toc-list a:hover { color: var(--wa-color-text-normal); background: color-mix(in srgb, var(--wa-color-surface-raised) 50%, transparent); }
    .toc-list a.toc-level-2 { padding-left: 0.5rem; }
    .toc-list a.toc-level-3 { padding-left: 1.25rem; }
    .toc-list a.toc-level-4 { padding-left: 2rem; }
    .toc-list a.toc-active { color: var(--wa-color-text-link); font-weight: 600; }

    /* ---- tree sizing ---- */
    wa-tree { font-size: 0.875rem; }
    wa-tree-item a {
      color: inherit;
      text-decoration: none;
    }
    wa-tree-item a:hover { color: var(--wa-color-text-link); }
    wa-tree-item.selected a,
    wa-tree-item[selected] a {
      color: var(--wa-color-text-link);
      font-weight: 600;
    }
    .sidebar,
    #mobile-tree .drawer {
      --wa-color-neutral-fill-quiet: color-mix(in srgb, var(--wa-color-brand-fill-loud) 14%, transparent);
    }
    .tree-section-header {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-weight: 600;
      color: var(--wa-color-text-normal);
    }
    .tree-section-header wa-icon { color: var(--wa-color-text-link); }

    /* tree filter states (toggled by site.js) */
    wa-tree-item.item-hidden { display: none; }
    wa-tree-item a.item-link-hidden { display: none; }

    /* Hide the raw (un-upgraded) custom elements until Web Awesome's
       definitions load, so the tree doesn't flash as a blob of text.
       The [hidden] attribute (set by site.js once the components are
       upgraded) is essential because the browsers don't style
       :not(:defined) until the elements are upgraded. */
    wa-tree:not(:defined),
    wa-tree wa-tree-item:not(:defined) {
      display: none;
    }
    wa-tree[hidden],
    wa-tree-item[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="layout <%= hasToc ? '' : 'no-toc' %>">

    <!-- left: page tree -->
    <aside class="sidebar" id="sidebar-desktop">
      <div class="sidebar-header">
        <a class="sidebar-brand" href="<%= homeHref %>">
          <img class="sidebar-favicon" src="<%= rawUrl('README/amd-favicon.png') %>" alt="" aria-hidden="true">
          <span>Strix&nbsp;Halo&nbsp;Wiki</span>
        </a>
      </div>
      <div class="sidebar-search">
        <input id="tree-search" type="search" placeholder="Filter pages…" aria-label="Filter pages">
      </div>
      <nav id="tree" class="sidebar-tree" aria-label="Wiki pages" data-active-key="<%= escapeHtml(activeKey) %>">
        <%- tree %>
      </nav>
    </aside>

    <!-- center: content -->
    <main>
      <div class="content-wrap">
        <h1 class="page-title"><%= title %></h1>
        <article id="content" class="wa-prose">
          <%- content %>
        </article>
        <footer class="page-footer">
          <% if (!isDirIndex) { %>
          <span>Generated from
            <a href="<%= rawUrl(rawPageHref) %>"><%= fileName %></a>
          </span>
          <span class="opacity-40">·</span>
          <% } %>
          <a href="<%= ghUrl %>">View on GitHub</a>
        </footer>
      </div>
    </main>

    <% if (hasToc) { %>
    <!-- right: on-this-page (desktop only; mobile uses #toc-btn drawer) -->
    <aside id="toc-nav" aria-label="On this page">
      <div class="toc-header">On this page</div>
      <nav id="toc" class="toc-list" aria-label="Table of contents">
        <%- toc %>
      </nav>
    </aside>
    <% } %>

  </div>

  <!-- mobile tree drawer -->
  <div id="mobile-tree" class="mobile-drawer" aria-hidden="true" data-active-key="<%= escapeHtml(activeKey) %>">
    <div class="backdrop" data-close></div>
    <div class="drawer">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
        <span class="tree-section-header">
          <img class="sidebar-favicon" src="<%= rawUrl('README/amd-favicon.png') %>" alt="" aria-hidden="true">
          <span>Strix&nbsp;Halo&nbsp;Wiki</span>
        </span>
        <button data-close aria-label="Close" style="background:none;border:0;color:var(--wa-color-text-quiet);font-size:1.25rem;cursor:pointer;">✕</button>
      </div>
      <%- tree %>
    </div>
  </div>
  <!-- mobile top bar (fixed) -->
  <header class="mobile-nav">
    <button id="menu-btn" class="nav-btn" aria-label="Open pages menu">☰ Pages</button>
    <span class="mobile-nav-spacer"></span>
    <% if (hasToc) { %>
    <button id="toc-btn" class="nav-btn" aria-label="Open table of contents">☰ On this page</button>
    <% } %>
  </header>

  <% if (hasToc) { %>
  <!-- mobile TOC drawer -->
  <div id="mobile-toc" class="mobile-drawer" aria-hidden="true">
    <div class="backdrop" data-close></div>
    <div class="drawer">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
        <span class="tree-section-header">On this page</span>
        <button data-close aria-label="Close" style="background:none;border:0;color:var(--wa-color-text-quiet);font-size:1.25rem;cursor:pointer;">✕</button>
      </div>
      <nav id="toc-mobile" class="toc-list" aria-label="Table of contents">
        <%- toc %>
      </nav>
    </div>
  </div>
  <% } %>

  <script><%- inlineJs %></script>
</body>
</html>
